# =============================================================================
# Deploy Pipeline — Multi-environment promotion with manual gating
# =============================================================================
#
# Flow: CI passes → build & push → deploy-dev → deploy-staging → deploy-prod
#
# Each environment has its own concurrency group to prevent parallel
# deployments from conflicting. Production requires manual approval.
#
# Image tagging strategy:
#   - Every merge to main builds :${{ github.sha }} (immutable)
#   - Each environment promotes that exact digest — no retagging
#   - GitOps-driven: ArgoCD watches the k8s overlays in this repo
#
# Authentication:
#   - AWS/GCP via OIDC federation (no static secrets)
#   - GitHub Container Registry via GITHUB_TOKEN
# =============================================================================

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Build & Push — only runs if CI succeeded
  # ===========================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./app
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag with semver if the triggering commit has a git tag
      - name: Tag with version (if tagged)
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          fi

  # ===========================================================================
  # Deploy to Dev — automatic after build
  # ===========================================================================
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-24.04
    needs: build-and-push
    environment:
      name: dev
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Update dev overlay with new image
        working-directory: k8s/overlays/dev
        run: |
          kustomize edit set image opsboard=${{ needs.build-and-push.outputs.image }}
          git config user.name "CI Bot"
          git config user.email "ci-bot@opsboard.io"
          git add kustomization.yaml
          git commit -m "chore: promote image ${{ github.sha }} to dev" || true
          git push

      - name: Wait for ArgoCD sync
        run: |
          echo "ArgoCD will auto-sync the dev overlay from Git."
          echo "Verify at: https://argocd.example.com/applications/opsboard-dev"

      - name: Smoke test
        run: |
          echo "Running smoke tests against dev environment..."
          # curl -sf https://opsboard-dev.example.com/api/health || exit 1

  # ===========================================================================
  # Deploy to Staging — automatic after dev
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-24.04
    needs: deploy-dev
    environment:
      name: staging
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Update staging overlay with new image
        working-directory: k8s/overlays/staging
        run: |
          kustomize edit set image opsboard=${{ needs.build-and-push.outputs.image }}
          git config user.name "CI Bot"
          git config user.email "ci-bot@opsboard.io"
          git add kustomization.yaml
          git commit -m "chore: promote image ${{ github.sha }} to staging" || true
          git push

      - name: Integration tests
        run: |
          echo "Running integration tests against staging..."
          # Run full test suite against staging environment

      - name: Soak test
        run: |
          echo "Running 5-minute soak test on staging..."
          # sleep 300
          # kubectl argo rollouts status opsboard --namespace opsboard

  # ===========================================================================
  # Deploy to Production — manual approval gate
  # ===========================================================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    needs: deploy-staging
    environment:
      name: production
      # Requires manual approval via GitHub Environments UI
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Update prod overlay with new image
        working-directory: k8s/overlays/prod
        run: |
          # Production uses digest-based immutability
          DIGEST=$(docker buildx imagetools inspect \
            ${{ needs.build-and-push.outputs.image }} \
            --format '{{json .Manifest.Digest}}')
          kustomize edit set image opsboard=${{ needs.build-and-push.outputs.image }}@$DIGEST
          git config user.name "CI Bot"
          git config user.email "ci-bot@opsboard.io"
          git add kustomization.yaml
          git commit -m "chore: promote image ${{ github.sha }} to production"
          git push

      - name: Monitor canary rollout
        run: |
          echo "Argo Rollout will perform canary deployment."
          echo "Monitor at: https://argocd.example.com/applications/opsboard-prod"

      - name: Verify deployment
        run: |
          echo "Verifying production deployment..."
          # curl -sf https://opsboard.example.com/api/health || exit 1

  # ===========================================================================
  # Notification — alert on success or failure
  # ===========================================================================
  notify:
    name: Notify
    runs-on: ubuntu-24.04
    if: always()
    needs: [build-and-push, deploy-dev, deploy-staging, deploy-prod]
    steps:
      - name: Post status to GitHub commit
        run: |
          echo "Deploy pipeline completed."
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Commit: ${{ github.sha }}"
