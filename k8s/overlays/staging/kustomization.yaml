apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Staging mirrors production replica count for realistic testing.
replicas:
  - name: opsboard
    count: 2

commonLabels:
  env: staging

# Pin a specific image tag for reproducible staging deployments
images:
  - name: opsboard
    newName: registry.example.com/opsboard
    newTag: staging-latest
