apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - hpa.yaml
  - networkpolicy.yaml

# Production runs 3 replicas for high availability.
replicas:
  - name: opsboard
    count: 3

commonLabels:
  env: prod

# Pin the image to a specific digest for immutability in production
images:
  - name: opsboard
    newName: registry.example.com/opsboard
    digest: sha256:abc123def456

# Prod: higher resource limits, stricter probes, add HPA and NetworkPolicy
patches:
  - target:
      kind: Deployment
      name: opsboard
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
