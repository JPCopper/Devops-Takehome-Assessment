apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opsboard-hpa
  namespace: opsboard
  labels:
    app.kubernetes.io/name: opsboard
    env: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opsboard
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
