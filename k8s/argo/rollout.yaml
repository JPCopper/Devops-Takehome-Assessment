# =============================================================================
# Argo Rollout — Canary Deployment Strategy
# =============================================================================
# This Rollout replaces the standard Deployment in k8s/base/ for the prod
# overlay. It performs a stepped canary deployment with automated health
# analysis and automatic rollback on failure.
#
# Traffic progression:   5% → 25% → 100%
#                       (60s)  (60s)
# Analysis runs after the first step and continues through the rollout.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: opsboard
  namespace: opsboard
  labels:
    app.kubernetes.io/name: opsboard
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: opsboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: opsboard
          image: opsboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: opsboard-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 30

  strategy:
    canary:
      # The stable service always points to the current stable ReplicaSet.
      # The canary service tracks the canary ReplicaSet during rollout.
      # Rollouts updates the service selectors automatically.
      canaryService: opsboard-canary
      stableService: opsboard

      # Stepped canary: 5% → pause 60s → 25% → pause 60s → 100%
      steps:
        - setWeight: 5
        - pause:
            duration: 60s
        - setWeight: 25
        - pause:
            duration: 60s
        - setWeight: 100

      # Run health analysis after the first step (at 5% traffic)
      analysis:
        templates:
          - templateName: opsboard-health-check
        startingStep: 1
        args:
          - name: service-name
            value: opsboard-canary

      # Prevent canary and stable pods from co-locating on the same node
      antiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          weight: 100

      # Keep old pods alive for 30s after traffic shifts to handle
      # in-flight requests gracefully
      scaleDownDelaySeconds: 30
---
# =============================================================================
# AnalysisTemplate — Health Check
# =============================================================================
# This template is referenced by the Rollout above. It periodically hits
# the canary service's health endpoint to verify the new version is
# healthy before allowing more traffic to shift.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: opsboard-health-check
  namespace: opsboard
spec:
  args:
    - name: service-name

  metrics:
    - name: health-check
      interval: 30s
      count: 5
      failureLimit: 2
      successCondition: "result == 200"
      provider:
        web:
          url: "http://{{args.service-name}}.opsboard.svc.cluster.local/health"
          method: GET
          timeoutSeconds: 5
          headers:
            - key: User-Agent
              value: argo-rollouts-analysis
