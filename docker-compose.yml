services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://opsboard:opsboard@postgres:5432/opsboard?schema=public
      - NODE_ENV=production
      - ENABLE_EXPERIMENTAL_METRICS=${ENABLE_EXPERIMENTAL_METRICS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opsboard
      POSTGRES_PASSWORD: opsboard
      POSTGRES_DB: opsboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
